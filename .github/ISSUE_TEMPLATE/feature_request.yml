name: Feature request
description: Propose a focused SOMA feature or integration.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or research gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior, command, API, or document change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory substrate
        - Trust boundary
        - ContextEnvelope
        - MCP/client integration
        - Dashboard/UX
        - Evaluation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Link prior art, papers, traces, tests, or examples where useful.
