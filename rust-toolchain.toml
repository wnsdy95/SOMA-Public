# Pinned toolchain for the workspace.
#
# We pin a specific x.y.z version instead of `stable` so CI, local
# development, and dependency security fixes move together in explicit,
# reviewable commits. The current floor is 1.88.0 because patched `time`
# releases used by the logging stack declare `rust-version = "1.88"`;
# keeping the older toolchain pin leaves the workspace on vulnerable `time`
# versions. The workspace `Cargo.toml` mirrors this floor with
# `rust-version = "1.88"`.

[toolchain]
channel    = "1.88.0"
components = ["rustfmt", "clippy"]
profile    = "minimal"
